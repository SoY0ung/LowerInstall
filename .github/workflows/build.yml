
name: Build Rootless arm64e .deb

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    env:
     THEOS: ${{ github.workspace }}/.theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          brew install ldid xz

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/sdks"

          curl -fL --retry 3 --retry-delay 3 \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          ls -la "$THEOS/sdks"

      - name: Show build environment
        run: |
          xcodebuild -version
          xcrun clang --version
          ls "$THEOS/sdks"

      - name: Build Rootless package
        run: |
          chmod +x layout/DEBIAN/postinst
          chmod +x layout/etc/rc.d/lowerinstall

          make clean
          make -j2 package FINALPACKAGE=1

      - name: Verify architectures
        run: |
          find . -name "LowerInstall.dylib" -type f -print

          DYLIB=$(find . -name "LowerInstall.dylib" \
            -type f | head -n 1)

          if [ -z "$DYLIB" ]; then
            echo "LowerInstall.dylib not found"
            exit 1
          fi

          xcrun lipo -info "$DYLIB"

          test -n "$(find packages -name '*iphoneos-arm64.deb' -print -quit)"
          ls -lh packages/*.deb

      - name: Upload Rootless .deb
        uses: actions/upload-artifact@v7
        with:
          name: LowerInstall-Rootless-arm64e
          path: packages/*.deb
          if-no-files-found: error
